<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Dividers</title>
  <meta name="description" content="Horizontal rules and micro-dividers with copy-paste code for CSS, Tailwind, Bootstrap, React, Vue and Svelte.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    /* ---------- Site theme ---------- */
    :root {
      --bg: #f6f6f4;
      --surface: #ffffff;
      --surface-2: #f1f1ee;
      --text: #1c1c1e;
      --muted: #6b6b70;
      --line: #e4e4e0;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --code-bg: #f7f7f5;
      --ok: #15803d;
      --radius: 14px;
      --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif: "Source Serif 4", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121214; --surface: #1b1b1e; --surface-2: #232327; --text: #ececee; --muted: #9a9aa2;
        --line: #2e2e33; --accent: #8b85ff; --accent-soft: #24233a; --code-bg: #161618; --ok: #4ade80;
        /* divider variables, so previews read well on dark */
        --divider-color: #4b4b52; --divider-strong: #a1a1aa; --divider-ink: #a1a1aa; --divider-text: #a1a1aa;
        --divider-shade: #000000; --divider-highlight: #34343a; --divider-accent: #8b85ff;
        --band-bg: #26262b; --card-bg: #26262b; --callout-bg: #24233a;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #121214; --surface: #1b1b1e; --surface-2: #232327; --text: #ececee; --muted: #9a9aa2;
      --line: #2e2e33; --accent: #8b85ff; --accent-soft: #24233a; --code-bg: #161618; --ok: #4ade80;
      --divider-color: #4b4b52; --divider-strong: #a1a1aa; --divider-ink: #a1a1aa; --divider-text: #a1a1aa;
      --divider-shade: #000000; --divider-highlight: #34343a; --divider-accent: #8b85ff;
      --band-bg: #26262b; --card-bg: #26262b; --callout-bg: #24233a;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-ui); font-size: 15px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); }
    button { font: inherit; color: inherit; }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }

    /* Header */
    .site-header { padding: 48px 16px 24px; }
    .site-header h1 {
      font-family: var(--font-serif); font-weight: 600; font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1; margin: 0 0 10px; letter-spacing: -0.01em;
    }
    .site-header p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 1.05rem; }

    /* Toolbar */
    .toolbar {
      position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    }
    .toolbar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 12px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
    .chip {
      border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
      padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
    .chip .n { opacity: .55; margin-left: 4px; font-variant-numeric: tabular-nums; }
    .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .search {
      border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px;
      font: inherit; font-size: 14px; color: var(--text); width: 190px; max-width: 100%;
    }
    .icon-btn {
      border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 34px; height: 34px;
      display: inline-grid; place-items: center; cursor: pointer; flex: none;
    }
    @media (max-width: 640px) {
      .toolbar { position: static; }
      .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    }
    .format-pick { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .format-pick select {
      border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px;
      padding: 5px 8px; font: inherit; font-size: 13px;
    }

    /* Gallery */
    .category { padding-top: 40px; }
    .category > h2 { font-family: var(--font-serif); font-weight: 600; font-size: 1.6rem; margin: 0 0 4px; }
    .category > p { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 18px; align-items: start; }

    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      display: flex; flex-direction: column; overflow: hidden; min-width: 0;
    }
    .card-preview {
      padding: 28px 24px; min-height: 160px; display: flex; flex-direction: column; justify-content: center;
      border-bottom: 1px solid var(--line); cursor: pointer; position: relative;
    }
    .card-preview:hover { background: var(--surface-2); }
    .card-preview:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .card-preview::after {
      content: "Open ↗"; position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted);
      opacity: 0; transition: opacity .15s;
    }
    .card-preview:hover::after, .card-preview:focus-visible::after { opacity: 1; }
    .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
    .card-title h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .card-title h3 button { all: unset; cursor: pointer; }
    .card-title h3 button:hover { text-decoration: underline; }
    .card-title h3 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
    .card-use { margin: 0; color: var(--muted); font-size: 13.5px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px;
      background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
    }
    .badge.classic { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .toggle-code {
      align-self: flex-start; margin-top: 4px; border: 1px solid var(--line); background: transparent;
      border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer;
    }
    .toggle-code:hover { background: var(--surface-2); }

    /* Code panel */
    .code { border-top: 1px solid var(--line); background: var(--code-bg); min-width: 0; }
    .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
    .tab {
      border: 0; background: none; padding: 9px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted);
      border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .snips { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .snip { position: relative; min-width: 0; }
    .snip-label { font-size: 11px; color: var(--muted); margin: 0 0 4px 2px; text-transform: uppercase; letter-spacing: .05em; }
    .snip pre {
      margin: 0; padding: 12px 14px; padding-right: 72px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 10px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55;
      cursor: copy; tab-size: 2;
    }
    .snip pre:hover, .snip pre:focus-visible { border-color: var(--accent); outline: none; }
    .copy {
      position: absolute; bottom: 8px; right: 8px; border: 1px solid var(--line); background: var(--surface-2);
      border-radius: 7px; padding: 3px 9px; font-size: 12px; cursor: pointer;
    }
    .copy.done { color: var(--ok); border-color: var(--ok); }
    .note { font-size: 12.5px; color: var(--muted); margin: 0 2px; }

    /* Detail page (dialog) */
    dialog.detail {
      width: min(1000px, calc(100vw - 16px)); max-height: calc(100vh - 16px); padding: 0; border: 1px solid var(--line);
      border-radius: 18px; background: var(--bg); color: var(--text);
    }
    dialog.detail::backdrop { background: rgb(0 0 0 / .45); }
    .detail-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 22px 20px 8px; }
    .detail-head h2 { font-family: var(--font-serif); font-size: 1.9rem; font-weight: 600; margin: 0 0 4px; line-height: 1.15; }
    .detail-head p { margin: 0; color: var(--muted); }
    .detail-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px !important; }
    .detail-main { padding: 12px 20px 24px; display: grid; gap: 16px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
    .panel-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 12px 16px 0; }
    .big-preview { padding: 36px clamp(16px, 4vw, 40px); }
    .article { padding: 24px clamp(16px, 5vw, 56px) 32px; font-family: var(--font-serif); font-size: 1.12rem; line-height: 1.7; }
    .article h3 { font-size: 1.5rem; margin: 0 0 .4em; line-height: 1.25; font-weight: 600; }
    .article p { margin: 0 0 1em; max-width: 62ch; }
    .a11y { padding: 14px 16px; display: grid; gap: 4px; }
    .a11y strong { font-size: 14px; }
    .a11y span { color: var(--muted); font-size: 14px; }
    .detail .code { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .detail-nav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .detail-nav button {
      border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
    }

    footer { padding: 56px 16px 40px; color: var(--muted); text-align: center; font-size: 14px; }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }

    /* Demo content used inside previews only */
    .demo-text { margin: 0; color: var(--muted); font-size: 14px; }
    .demo-dark { background: #0b1020; padding: 24px; border-radius: 10px; }
    .demo-wave-after { background: #6366f1; color: #fff; padding: 12px 16px; font-size: 14px; border-radius: 0 0 8px 8px; }
    .preview-surface h2, .preview-surface h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    .preview-surface p { margin: 0; }
    .article.preview-surface h3 { font-size: 1.5rem; margin: 0 0 .4em; }
    .article.preview-surface p { margin: 0 0 1em; }
  </style>
  <!-- Divider styles: generated from the same strings the "HTML + CSS" tab shows -->
  <style id="divider-css"></style>
</head>

      </div>

  <main class="wrap" id="gallery"></main>

  <footer class="wrap">

  <dialog class="detail" id="detail" aria-labelledby="detail-title"></dialog>

<script>
/* ======================================================================

const CATEGORIES = [

/* ======================================================================
   React / Vue / Svelte tabs, generated from the Tailwind markup
   ====================================================================== */
const pascal = id => id.replace(/(^|-)(\w)/g, (_, __, c) => c.toUpperCase());
const indent = (s, n) => s.split("\n").map(l => (l ? " ".repeat(n) + l : l)).join("\n");
// Split the root element's opening tag into its class list and other attributes.
function splitRoot(markup) {
  const m = markup.match(/^<([a-z0-9]+)([^>]*?)>/i);
  const attrs = m[2];
  const cls = (attrs.match(/\sclass="([^"]*)"/) || [, ""])[1];
  const rest = attrs.replace(/\sclass="[^"]*"/, "");
  return { tag: m[1], cls, rest, after: markup.slice(m[0].length) };
}

function toReact(d) {
  const name = "Divider" + pascal(d.id).replace(/^Divider/, "");
  const r = splitRoot(d.tw);
  const isVoid = /^(hr|img)$/.test(r.tag);
  const rest = r.rest.replace(/style="height: 40px"/, "style={{ height: 40 }}");
  const open = `<${r.tag}${rest}\n  className={cn("${r.cls}", className)}\n  {...props}\n${isVoid ? "/>" : ">"}`;
  const jsx = (open + r.after)
    .replace(/\sclass="/g, ' className="')
    .replace(/\s(stroke|fill)-([a-z]+)=/g, (_, a, b) => ` ${a}${b[0].toUpperCase()}${b.slice(1)}=`);
  return `// components/ui/${d.id}.tsx
import { cn } from "@/lib/utils"

export function ${name}({ className, ...props }: React.ComponentProps<"${r.tag}">) {
  return (
${indent(jsx, 4)}
  )
}`;
}

const toVue = d => `<!-- components/${pascal(d.id)}.vue -->
<template>
${indent(d.tw, 2)}
</template>`;

function toSvelte(d) {
  const r = splitRoot(d.tw);
  const cls = r.cls ? `${r.cls} {className}` : "{className}";
  return `<!-- lib/components/${pascal(d.id)}.svelte -->
<script>
  let { class: className = "", ...rest } = $props();
<\/script>

<${r.tag}${r.rest} class="${cls}" {...rest}>${r.after}`;
}

const FORMATS = [
  { id: "css", label: "HTML + CSS",
    snips: d => [{ label: "HTML", code: d.html }, ...(d.css ? [{ label: "CSS", code: d.css }] : [])],
    note: d => d.css ? "" : "No CSS needed: this is the browser's built-in style." },
  { id: "tw", label: "Tailwind v4",
    snips: d => [{ code: d.tw }], note: d => d.twNote || "" },
  { id: "bs", label: "Bootstrap 5.3",
    snips: d => [{ label: "HTML", code: d.bs }, ...(d.bsCss ? [{ label: "CSS", code: d.bsCss }] : [])],
    note: d => d.bsCss ? "Bootstrap has no utility for this part, so add the small CSS rule." : "" },
  { id: "react", label: "React",
    snips: d => [{ code: toReact(d) }],
    note: () => "shadcn/ui style, with Tailwind classes. Uses the cn() helper from @/lib/utils (clsx + tailwind-merge)." },
  { id: "vue", label: "Vue",
    snips: d => [{ code: toVue(d) }],
    note: () => "Tailwind classes. Vue passes extra classes and attributes to the root element automatically." },
  { id: "svelte", label: "Svelte 5",
    snips: d => [{ code: toSvelte(d) }],
    note: () => "Tailwind classes. Extra classes and attributes are forwarded to the root element." },
];

/* ======================================================================
   UI
   ====================================================================== */
const store = {
  get(k, f) { try { return localStorage.getItem(k) ?? f; } catch { return f; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let currentFormat = store.get("dividers.format", "css");
if (!FORMATS.some(f => f.id === currentFormat)) currentFormat = "css";
let currentCat = "all";
let query = "";

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};

// The live previews use exactly the CSS the "HTML + CSS" tab hands out.
$("#divider-css").textContent = D.filter(d => d.css).map(d => d.css).join("\n\n");

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = el("textarea", { style: "position:fixed;opacity:0" }, text);
    document.body.append(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
  btn.textContent = "Copied ✓"; btn.classList.add("done");
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1400);
}

function snippetBlock(s) {
  const btn = el("button", { class: "copy", type: "button", "aria-label": `Copy ${s.label || "code"}` }, "Copy");
  const pre = el("pre", { tabindex: "0", title: "Click to copy" }, el("code", {}, s.code));
  const go = () => copyText(s.code, btn);
  btn.addEventListener("click", go);
  pre.addEventListener("click", () => { if (!getSelection().toString()) go(); });
  pre.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  return el("div", { class: "snip" }, s.label ? el("p", { class: "snip-label" }, s.label) : null, pre, btn);
}

function codePanel(d, uid) {
  const panel = el("div", { class: "code" });
  const tabs = el("div", { class: "tabs", role: "tablist", "aria-label": `${d.name} code formats` });
  const body = el("div", { class: "snips", role: "tabpanel", id: `${uid}-panel` });
  const show = fid => {
    const f = FORMATS.find(x => x.id === fid);
    body.replaceChildren(...f.snips(d).map(snippetBlock));
    const n = f.note(d);
    if (n) body.append(el("p", { class: "note" }, n));
    tabs.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.f === fid)));
  };
  FORMATS.forEach(f => tabs.append(el("button", {
    class: "tab", role: "tab", type: "button", "data-f": f.id, "aria-controls": `${uid}-panel`,
    onclick: () => setFormat(f.id),
  }, f.label)));
  panel.append(tabs, body);
  panel._show = show;
  show(currentFormat);
  return panel;
}

// Picking a format anywhere switches every open code panel and is remembered.
function setFormat(fid) {
  currentFormat = fid;
  store.set("dividers.format", fid);
  $("#format").value = fid;
  document.querySelectorAll(".code").forEach(p => p._show && p._show(fid));
}

function previewNode(d, cls) {
  const p = el("div", { class: "preview-surface " + cls });
  p.innerHTML = d.demo || d.html;
  p.querySelectorAll("a").forEach(a => a.setAttribute("tabindex", "-1"));
  return p;
}

function badges(d) {
  return el("div", { class: "badges" },
    el("span", { class: "badge", title: A11Y[d.a11y][1] }, A11Y[d.a11y][0]),
    d.classic ? el("span", { class: "badge classic", title: "From the original page, modernised" }, "Classic") : null);
}

function card(d) {
  const uid = "c-" + d.id;
  let panel = null;
  const toggle = el("button", { class: "toggle-code", type: "button", "aria-expanded": "false", "aria-controls": uid + "-code" }, "Show code");
  const open = () => openDetail(d.id);
  const c = el("article", { class: "card", id: d.id },
    el("div", { class: "card-preview", tabindex: "0", role: "button", "aria-label": `Open ${d.name}`,
      onclick: open, onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } } },
      previewNode(d, "")),
    el("div", { class: "card-body" },
      el("div", { class: "card-title" }, el("h3", {}, el("button", { type: "button", onclick: open }, d.name))),
      el("p", { class: "card-use" }, d.use),
      badges(d),
      toggle));
  toggle.addEventListener("click", () => {
    const isOpen = toggle.getAttribute("aria-expanded") === "true";
    if (!panel) { panel = codePanel(d, uid); panel.id = uid + "-code"; c.append(panel); }
    panel.hidden = isOpen;
    toggle.setAttribute("aria-expanded", String(!isOpen));
    toggle.textContent = isOpen ? "Show code" : "Hide code";
  });
  return c;
}

function matches(d) {
  if (currentCat !== "all" && d.cat !== currentCat) return false;
  if (!query) return true;
  const hay = `${d.name} ${d.use} ${d.id} ${A11Y[d.a11y][0]}`.toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}

function renderGallery() {
  const g = $("#gallery");
  g.replaceChildren();
  let shown = 0;
  for (const cat of CATEGORIES) {
    const items = D.filter(d => d.cat === cat.id && matches(d));
    if (!items.length) continue;
    shown += items.length;
    g.append(el("section", { class: "category", "aria-labelledby": "h-" + cat.id },
      el("h2", { id: "h-" + cat.id }, cat.name),
      el("p", {}, cat.blurb),
      el("div", { class: "grid" }, items.map(card))));
  }
  if (!shown) g.append(el("p", { class: "empty" }, "No dividers match that search."));
}

function renderChips() {
  const all = [{ id: "all", name: "All", n: D.length },
    ...CATEGORIES.map(c => ({ ...c, n: D.filter(d => d.cat === c.id).length }))];
  $("#chips").replaceChildren(...all.map(c => el("button", {
    class: "chip", type: "button", "aria-pressed": String(currentCat === c.id),
    onclick: () => { currentCat = c.id; renderChips(); renderGallery(); },
  }, c.name, el("span", { class: "n" }, c.n))));
}

/* ---------- Detail page (opens as a dialog, linkable as #/divider-id) ---------- */
const dlg = $("#detail");

function openDetail(id, push = true) {
  const i = D.findIndex(d => d.id === id);
  if (i < 0) return;
  const d = D[i];
  const prev = D[(i - 1 + D.length) % D.length], next = D[(i + 1) % D.length];
  const cat = CATEGORIES.find(c => c.id === d.cat);

  const article = el("div", { class: "article preview-surface" });
  article.innerHTML = `<h3>The quiet work of a divider</h3>
    <p>A good divider tells the reader that one idea has ended and another is about to begin, without shouting about it. It should feel like a breath between paragraphs.</p>
    ${d.demo || d.html}
    <p>Here the next thought picks up. Notice how the spacing, weight and color of the break change the pace of the page.</p>`;
  article.querySelectorAll("a").forEach(a => a.setAttribute("tabindex", "-1"));

  dlg.replaceChildren(
    el("div", { class: "detail-head" },
      el("div", {},
        el("p", { class: "detail-kicker" }, cat.name),
        el("h2", { id: "detail-title" }, d.name),
        el("p", {}, d.use)),
      el("button", { class: "icon-btn", type: "button", "aria-label": "Close", onclick: () => closeDetail() }, "✕")),
    el("div", { class: "detail-main" },
      el("div", { class: "panel" }, el("p", { class: "panel-title" }, "Preview"), previewNode(d, "big-preview")),
      el("div", { class: "panel" }, el("p", { class: "panel-title" }, "In context"), article),
      el("div", { class: "panel a11y" },
        el("strong", {}, "Accessibility: " + A11Y[d.a11y][0]),
        el("span", {}, A11Y[d.a11y][1]),
        d.note ? el("span", {}, d.note) : null),
      codePanel(d, "dlg-" + d.id),
      el("div", { class: "detail-nav" },
        el("button", { type: "button", onclick: () => openDetail(prev.id) }, "← " + prev.name),
        el("button", { type: "button", onclick: () => openDetail(next.id) }, next.name + " →"))));

  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
  if (push && location.hash !== "#/" + id) history.pushState(null, "", "#/" + id);
}

function closeDetail(push = true) {
  if (dlg.open) dlg.close();
  if (push && location.hash.startsWith("#/")) history.pushState(null, "", location.pathname + location.search);
}

dlg.addEventListener("click", e => { if (e.target === dlg) closeDetail(); });
dlg.addEventListener("cancel", e => { e.preventDefault(); closeDetail(); });
const fromHash = () => {
  const m = location.hash.match(/^#\/([\w-]+)/);
  if (m) openDetail(m[1], false); else closeDetail(false);
};
window.addEventListener("popstate", fromHash);

/* ---------- Toolbar ---------- */
const fmtSel = $("#format");
FORMATS.forEach(f => fmtSel.append(el("option", { value: f.id }, f.label)));
fmtSel.value = currentFormat;
fmtSel.addEventListener("change", () => setFormat(fmtSel.value));

$("#search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderGallery(); });

const savedTheme = store.get("dividers.theme", "");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  store.set("dividers.theme", root.dataset.theme);
});

renderChips();
renderGallery();
fromHash();
</script>
</body>
</html>
